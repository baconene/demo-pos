name: DEMO POS CI
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install PHP and Node dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          npm ci
      - name: Configure isolated SQLite test environment
        run: |
          cp .env.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/;s/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/;s/^DB_DATABASE=.*/DB_DATABASE=:memory:/;s/^CACHE_STORE=.*/CACHE_STORE=array/;s/^SESSION_DRIVER=.*/SESSION_DRIVER=array/;s/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env
          php artisan key:generate
      - name: Build production frontend
        run: npm run build
      - name: Test DEMO POS required field matrix
        run: php artisan test --filter=DemoPosOrderFieldValidationTest
      - name: Test one-time administrator security and registration lockout
        run: php artisan test --filter=InitialAdminSetupTest
      - name: Test generic sample catalog and safe reruns
        run: php artisan test --filter=DemoPosSampleCatalogSeederTest
      - name: Test fictional four-month POS/financial history
        run: php artisan test --filter=DemoPosHistoricalDataSeederTest
      - name: Test royalty controller restoration and route listing
        run: php artisan test --filter=RoyaltyRulesRouteTest
      - name: Validate all Laravel routes resolve
        run: |
          php artisan route:list --path=setup/admin
          php artisan route:list --path=api/v1/royalty-rules
      - name: Validate PHP syntax for seeder and history classes
        run: |
          for file in database/seeders/*.php app/Services/DemoHistoryGenerator.php app/Console/Commands/SeedDemoHistory.php app/Http/Controllers/Api/V1/RoyaltyRuleController.php app/Models/RoyaltyRule.php; do php -l "$file"; done
      - name: Validate PHP syntax on client order API
        run: |
          php -l app/Http/Requests/StoreOrderRequest.php
          php -l app/Http/Controllers/Api/V1/MobilePosController.php
